name: Reproducible real-map baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run bootstrap
      - run: npm test
      - run: npm run experiment
      - name: Keep numeric benchmark result only
        uses: actions/upload-artifact@v4
        with:
          name: mt1-result-node-${{ matrix.node }}
          path: generated/mt1.json

  original-flash:
    runs-on: ubuntu-latest
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify pinned public SWF locally on runner
        run: python3 tools/fetch_swf.py mhhf
      - name: Verify original bytecode and exact local support models
        run: python3 tools/flash_milestone.py generated/private/mhhf.swf --check experiments/flash-M4.json
      - name: Original-bytecode integration regression tests
        run: python3 -m unittest discover -s tests -p "test_flash_integration.py"
      - name: Original full-route adapter and plot boundary regression tests
        run: python3 -m unittest discover -s tests -p "test_original_route.py"
      - name: Reconstruct published eleven-floor numeric progress receipts
        run: python3 tools/verify_route_progress.py experiments/full-route-prefix11.json generated/private/mhhf.swf
      - name: Keep numeric evidence only, never original assets
        uses: actions/upload-artifact@v4
        with:
          name: original-flash-M4-numeric-evidence
          path: generated/flash-M4.json

  independent-ruffle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Install browser using libraries preinstalled on the pinned runner
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Fetch original candidate and pinned official Ruffle release locally
        run: |
          npm run flash:fetch
          npm run ruffle:fetch
      - name: Exhaust RNG states, execute independent player probes, verify real-map bound
        run: npm run ruffle:verify
      - name: M5 finite-model and native-port tests
        run: python3 -m unittest discover -s tests -p "test_ruffle_rng.py"
      - name: Whole original movie replay and observer-free control
        run: npm run game:verify
      - name: Natural-opening and fixed-seed regression tests
        run: python3 -m unittest discover -s tests -p "test_seed_search.py"
      - name: Cross-floor whole movie witness, shops and resource-rank certificate
        run: npm run crossfloor:verify
      - name: Original-shop and rank regression tests
        run: python3 -m unittest discover -s tests -p "test_shops.py"
      - name: Keep numerical evidence only
        uses: actions/upload-artifact@v4
        with:
          name: original-Ruffle-M5-M6-M7-evidence
          path: |
            generated/M5/ruffle-M5.json
            generated/M6/whole-game-M6.json
            generated/M7/crossfloor-M7.json

  original-crossfloor-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Install browser using preinstalled runner libraries
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Fetch and hash-check pinned original and independent player
        run: |
          npm run flash:fetch
          npm run ruffle:fetch
      - name: Real-map bounded search, grid oracle, whole-movie replay and control
        run: npm run optimization:verify
      - name: Search transition, resource bound and grid route tests
        run: python3 -m unittest discover -s tests -p "test_crossfloor_search.py"
      - name: Keep numeric evidence only; no original assets or screenshots
        uses: actions/upload-artifact@v4
        with:
          name: original-Ruffle-M8-numeric-evidence
          path: generated/M8/optimization-M8.json
