name: Reproducible real-map baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run bootstrap
      - run: npm test
      - run: npm run experiment
      - name: Keep numeric benchmark result only
        uses: actions/upload-artifact@v4
        with:
          name: mt1-result-node-${{ matrix.node }}
          path: generated/mt1.json

  original-flash:
    runs-on: ubuntu-latest
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify pinned public SWF locally on runner
        run: python3 tools/fetch_swf.py mhhf
      - name: Verify original bytecode and exact local support models
        run: python3 tools/flash_milestone.py generated/private/mhhf.swf --check experiments/flash-M4.json
      - name: Original-bytecode integration regression tests
        run: python3 -m unittest discover -s tests -p "test_flash_integration.py"
      - name: Keep numeric evidence only, never original assets
        uses: actions/upload-artifact@v4
        with:
          name: original-flash-M4-numeric-evidence
          path: generated/flash-M4.json
