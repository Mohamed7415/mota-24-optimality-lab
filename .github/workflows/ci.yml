name: Reproducible real-map baseline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - run: npm run bootstrap
      - run: npm test
      - run: npm run experiment
      - name: Keep numeric benchmark result only
        uses: actions/upload-artifact@v4
        with:
          name: mt1-result-node-${{ matrix.node }}
          path: generated/mt1.json

  original-flash:
    runs-on: ubuntu-latest
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and verify pinned public SWF locally on runner
        run: python3 tools/fetch_swf.py mhhf
      - name: Verify original bytecode and exact local support models
        run: python3 tools/flash_milestone.py generated/private/mhhf.swf --check experiments/flash-M4.json
      - name: Original-bytecode integration regression tests
        run: python3 -m unittest discover -s tests -p "test_flash_integration.py"
      - name: Original full-route adapter and plot boundary regression tests
        run: python3 -m unittest discover -s tests -p "test_original_route.py"
      - name: Reconstruct published eleven-floor numeric progress receipts
        run: python3 tools/verify_route_progress.py experiments/full-route-prefix11.json generated/private/mhhf.swf
      - name: Reconstruct sixteen-floor progress and numerical nineteen-floor branch
        run: |
          python3 tools/verify_route_progress.py experiments/full-route-prefix16.json generated/private/mhhf.swf
          python3 tools/verify_route_proposal.py experiments/full-route-numeric19-proposal.json generated/private/mhhf.swf
      - name: Reexecute complete numeric route and require final ending transition
        run: python3 tools/verify_route_proposal.py experiments/full-route-ending-9863-shorter-proposal.json generated/private/mhhf.swf --require-numeric-ending
      - name: Recheck complete native route receipt and every observed battle
        run: python3 tools/verify_route_progress.py experiments/full-route-native-ending-9863.json generated/private/mhhf.swf
      - name: Reexecute complete 10088 route, native receipt and conditional shop budget
        run: |
          python3 tools/verify_route_proposal.py experiments/full-route-ending-10088-proposal.json generated/private/mhhf.swf --require-numeric-ending
          python3 tools/verify_route_proposal.py experiments/full-route-hp28376-proposal.json generated/private/mhhf.swf --require-numeric-ending
          python3 tools/verify_route_progress.py experiments/full-route-native-ending-10088.json generated/private/mhhf.swf
          python3 tools/verify_route_progress.py experiments/full-route-native-hp28376.json generated/private/mhhf.swf
          python3 tools/fixed_suffix_shop_budget.py experiments/full-route-ending-10088-proposal.json --prefix-actions 1147 --check experiments/full-route-ending-10088-shop-budget.json
      - name: Reproduce fixed-prefix allocation search and HP candidate construction
        run: |
          python3 tools/search_prefix_shop_allocation.py
          python3 tools/reorder_late_health.py
          python3 tools/combine_hp_candidate.py
          python3 tools/verify_route_proposal.py generated/CombinedHP/proposal.json generated/private/mhhf.swf --require-numeric-ending
      - name: Reproduce all-potion deferral relaxation and original-bytecode positive control
        run: |
          python3 tools/search_potion_deferral.py --check experiments/early-potion-deferral-bound.json
          python3 tools/search_potion_deferral.py --reserve 690,721 --out generated/AllPotionDeferralsControl --check experiments/early-potion-deferral-control.json
          python3 tools/search_potion_deferral.py --asap-gold --asap-xp --reserve 690,721 --out generated/AllPotionDeferralsAsapControl --check experiments/early-potion-deferral-asap-control.json
      - name: Rebuild mixed-potion 28554 route and verify its native receipt
        run: |
          python3 tools/search_mixed_potion_reserve.py --advance 135,143 --extra-advance 352,353 --extra-advance 352,549 --must-eat 333,375,376,549 --target-reserve 1200 --check experiments/mixed-potion-reserve-1200.json
          python3 tools/combine_hp_candidate.py --prefix generated/MixedPotionReserve/proposal.json --directory generated/RebuiltHP28554 --expected-hp 28554
          python3 tools/verify_route_proposal.py experiments/full-route-hp28554-proposal.json generated/private/mhhf.swf --require-numeric-ending
          python3 tools/verify_route_progress.py experiments/full-route-native-hp28554.json generated/private/mhhf.swf
      - name: Rebuild rejected early-boost branch and its conditional AD budget
        run: python3 tools/route_resource_bound.py experiments/rejected-prefix23-proposal.json generated/private/mhhf.swf --check experiments/rejected-prefix23-ad-bound.json
      - name: Keep numeric evidence only, never original assets
        uses: actions/upload-artifact@v4
        with:
          name: original-flash-M4-numeric-evidence
          path: generated/flash-M4.json

  historical-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
      MOTA_GDUT_SWF: generated/private/gdut.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch two independently pinned archives without republishing assets
        run: |
          python3 tools/fetch_swf.py mhhf
          python3 tools/fetch_swf.py gdut
      - name: Reproduce static comparison and reject swapped archive identities
        run: |
          python3 tools/compare_swf_builds.py generated/private/mhhf.swf generated/private/gdut.swf --out generated/archive-comparison.json --check experiments/swf-build-comparison.json
          python3 -m unittest discover -s tests -p "test_swf_builds.py"
          python3 tools/verify_route_progress.py experiments/full-route-native-gdut-hp28554.json generated/private/gdut.swf
          python3 tools/reorder_central_healing.py --out generated/RebuiltCentralHealing
          python3 -c "import json; a=json.load(open('generated/RebuiltCentralHealing/proposal.json')); b=json.load(open('experiments/full-route-hp28568-proposal.json')); assert a['actions']==b['actions'] and a['resources']==b['resources']"

  independent-ruffle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Install browser using libraries preinstalled on the pinned runner
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Fetch original candidate and pinned official Ruffle release locally
        run: |
          npm run flash:fetch
          npm run ruffle:fetch
      - name: Exhaust RNG states, execute independent player probes, verify real-map bound
        run: npm run ruffle:verify
      - name: M5 finite-model and native-port tests
        run: python3 -m unittest discover -s tests -p "test_ruffle_rng.py"
      - name: Whole original movie replay and observer-free control
        run: npm run game:verify
      - name: Natural-opening and fixed-seed regression tests
        run: python3 -m unittest discover -s tests -p "test_seed_search.py"
      - name: Cross-floor whole movie witness, shops and resource-rank certificate
        run: npm run crossfloor:verify
      - name: Original-shop and rank regression tests
        run: python3 -m unittest discover -s tests -p "test_shops.py"
      - name: Keep numerical evidence only
        uses: actions/upload-artifact@v4
        with:
          name: original-Ruffle-M5-M6-M7-evidence
          path: |
            generated/M5/ruffle-M5.json
            generated/M6/whole-game-M6.json
            generated/M7/crossfloor-M7.json

  original-crossfloor-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MOTA_FLASH_SWF: generated/private/mhhf.swf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts
      - name: Install browser using preinstalled runner libraries
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Fetch and hash-check pinned original and independent player
        run: |
          npm run flash:fetch
          npm run ruffle:fetch
      - name: Real-map bounded search, grid oracle, whole-movie replay and control
        run: npm run optimization:verify
      - name: Search transition, resource bound and grid route tests
        run: python3 -m unittest discover -s tests -p "test_crossfloor_search.py"
      - name: Keep numeric evidence only; no original assets or screenshots
        uses: actions/upload-artifact@v4
        with:
          name: original-Ruffle-M8-numeric-evidence
          path: generated/M8/optimization-M8.json
